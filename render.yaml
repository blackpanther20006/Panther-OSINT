services:
  - type: web
    name: panther-osint
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PRODUCTION
        value: '1'
      - key: SECRET_KEY
        generateValue: true
